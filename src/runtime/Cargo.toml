[package]
name = "jade-runtime"
version = "0.1.0"
edition = "2024"
description = "Shared Jade runtime core: the tagged value ABI, unified heap, and value semantics used by both the bytecode VM (rlib) and AOT-compiled binaries (C-ABI staticlib)."
license = "MIT"

# rlib  → linked natively by the `jade` VM crate.
# staticlib → linked via C-ABI (`#[no_mangle] extern "C"`) by AOT binaries,
#             replacing the hand-rolled semantics in runtime_lib/common.c.
[lib]
crate-type = ["rlib", "staticlib"]

# LLVM-free (must not drag the frontend into an LLVM toolchain requirement).
# `serde_json` is the one dependency: json.parse/stringify must be byte-identical
# to the VM, which uses serde_json — reimplementing JSON by hand risks divergence.
# It is already a transitive dep of `jade run`, and is pure-Rust/std. (Revisit if a
# no-std jadeos-target AOT build ever needs it gone.)
[dependencies]
serde_json = "1"
