[package]
name = "jade-codegen"
version = "0.1.0"
edition = "2021"
description = "Jade AOT backend — bytecode Chunk → LLVM → native binary. Lives in the open-source language repo so `jade run` (VM) and `jade build` (AOT) share one lowering; only the daemon wiring stays in jade-buildd."
license = "MIT"

[dependencies]
# Language frontend + compiler types (TIR, AST, emit/Chunk, VM value types).
# Single source of truth — the AOT backend mirrors the VM.
jade = { path = ".." }

# LLVM 18 backend (kept out of the `jade` crate so `jade run` stays LLVM-free).
inkwell = { version = "0.8", features = ["llvm18-1"] }

[build-dependencies]
# Compiles the C runtime (runtime_lib/) that emitted binaries link against.
cc = "1"
