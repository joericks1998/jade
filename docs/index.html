<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: #4ade80;
    }

    .tagline {
      font-size: 1.15rem;
      color: #888;
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #4ade80;
      font-size: 0.8rem;
      font-family: "SF Mono", "Fira Code", monospace;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    .links {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.5rem;
    }

    .links a {
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.15s;
    }

    .links a:hover { color: #e8e8e8; }
  </style>
</head>
<body>
  <div class="logo">jade</div>
  <p class="tagline">
    A systems-capable programming language with first-class LLM integration.
  </p>
  <span class="badge">coming soon</span>
  <div class="links">
    <a href="https://github.com/joericks1998/jade">GitHub</a>
  </div>
</body>
</html>
