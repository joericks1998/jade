<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f7faf8;
      color: #1c2e1c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
    }

    .logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .logo-name {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: #1e7a2e;
    }

    .tagline {
      font-size: 1.1rem;
      color: #5a7a5a;
      text-align: center;
      max-width: 480px;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      background: #e6f4eb;
      border: 1px solid #b6dcc2;
      color: #1e7a2e;
      font-size: 0.8rem;
      font-family: "SF Mono", "Fira Code", monospace;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    .links {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.25rem;
    }

    .links a {
      color: #8aaa8a;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.15s;
    }

    .links a:hover { color: #1e7a2e; }
  </style>
</head>
<body>
  <img class="logo-img" src="extras/logo.png" alt="Jade logo" />
  <div class="logo-name">jade</div>
  <p class="tagline">
    Jade is a programming language written in Rust. It currently runs <code>.jde</code> files, evaluates arithmetic expressions, and assigns variables.
  </p>
  <pre style="background:#e6f4eb;color:#1c2e1c;font-family:monospace;padding:1rem 1.4rem;border-radius:8px;line-height:1.6;font-size:0.9rem;">let add = 1 + 1
let result = add * 2</pre>
  <pre style="background:#e6f4eb;color:#1c2e1c;font-family:monospace;padding:0.75rem 1.4rem;border-radius:8px;line-height:1.6;font-size:0.85rem;">jade &lt;file.jde&gt;
jade &lt;file.jde&gt; --verbose</pre>
  <span class="badge">phase 1 — interpreter</span>
  <div class="links">
    <a href="https://github.com/joericks1998/jade">GitHub</a>
  </div>
</body>
</html>
