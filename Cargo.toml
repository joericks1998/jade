# The repo's workspace. It holds two programs, each a directory with its own
# Cargo.toml, README.md and src/, and each with its own version and releases:
#
# - compiler/: `jade`, the compiler and the rest of the toolchain. Needs LLVM 18.
# - dovata/: the process that holds a model's memory and plans it for the
#   compiler. Needs no LLVM.
#
# A bare cargo command here means the compiler, through default-members, so
# `cargo build` and `cargo test` work as they always have. Name dovata's
# packages with -p: `cargo build -p dovata`.
[workspace]
members = [
    "compiler",
    "dovata",
    # `dovata-chat-template`: the optional chat-template package for Jade users. Its
    # own crate because templates are the programmer's to choose; dovata's plan carries
    # the tokenizer, and this package uses dovata's vocabulary check. See its README.
    "dovata/src/chat_template",
    # `refback`: dovata's test-only reference backend. It sets up a plan's memory for
    # real and checks every tensor against the model file, so it needs unsafe code and
    # Apple's Metal framework, neither of which belongs in dovata. Never published.
    "dovata/src/refback",
]
default-members = ["compiler"]
# The resolver the compiler's edition, 2024, picked when it was the root package.
resolver = "3"

# What dovata's crates inherit. The compiler sets its own edition, 2024.
[workspace.package]
edition = "2021"
authors = ["JADE OS Contributors"]
license = "MIT"
