[package]
name = "jade"
version = "2.0.1"
edition = "2024"
description = "A language for LLMs"
license = "MIT"


[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Format-preserving TOML, used by `jade add`/`jade remove` to edit a user's
# jade.toml without discarding their comments and layout the way a
# parse-and-reserialize round-trip would. Already in the tree as a dependency
# of `toml`, so declaring it costs no extra build.
toml_edit = "0.22"
bincode = "1"
sha2 = "0.10"
libloading = "0.8"
# LLVM 18, which the static backend (src/backend/) generates code through.
# `jade build` compiles in-process — there is no build daemon — so this is a hard dependency
# and LLVM 18 must be present to build the toolchain. Locate it with
# LLVM_SYS_180_PREFIX. Running a released binary needs nothing installed.
inkwell = { version = "0.8", features = ["llvm18-1"] }

[build-dependencies]
# Compiles src/backend/lld.cpp, the bridge into LLD; see build.rs.
cc = "1"

# ── Workspace ─────────────────────────────────────────────────────────────────
# dovata, the process that holds a model's memory, lives under dovata/ as its own
# crate and its own programs, with its own version and its own releases. This
# package is the workspace root, so `cargo build` here builds jade alone, and
# `cargo build -p dovata` builds dovata, which needs no LLVM.
[workspace]
members = [
    ".",
    "dovata",
    # `dovata-chat-template`: the optional chat-template package for Jade users. Its
    # own crate because templates are the programmer's to choose; dovata's plan carries
    # the tokenizer, and this package uses dovata's vocabulary check. See its README.
    "dovata/src/chat_template",
    # `refback`: dovata's test-only reference backend. It sets up a plan's memory for
    # real and checks every tensor against the model file, so it needs unsafe code and
    # Apple's Metal framework, neither of which belongs in dovata. Never published.
    "dovata/src/refback",
]

# What dovata's crates inherit. jade sets its own edition, 2024, in [package].
[workspace.package]
edition = "2021"
authors = ["JADE OS Contributors"]
license = "MIT"
