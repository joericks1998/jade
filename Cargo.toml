[package]
name = "jade"
version = "1.1.19"
edition = "2024"
description = "A language for LLMs"
license = "MIT"


[dependencies]
jade-runtime = { path = "src/runtime" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
async-recursion = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1"
sha2 = "0.10"
libloading = "0.8"
# LLVM 18 backend for the AOT codegen module (src/codegen/). Building this crate
# now requires LLVM 18 (located via .cargo/config.toml's LLVM_SYS_180_PREFIX).
inkwell = { version = "0.8", features = ["llvm18-1"] }

[build-dependencies]
# Compiles the C runtime (runtime_lib/) that emitted AOT binaries link against.
cc = "1"
