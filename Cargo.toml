[package]
name = "jade"
version = "1.1.2"
edition = "2024"
description = "A language for LLMs"
license = "MIT"

[features]
default = []
llvm = ["dep:inkwell"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1"
sha2 = "0.10"
inkwell = { version = "0.8", features = ["llvm18-1"], optional = true }
