# deci: Llama with a different shape in each layer, from DeciLM and NVIDIA's
# neural-architecture search: DeciLM-7B, Llama-3.1-Nemotron-51B, Llama-3.3-Nemotron-
# Super-49B and Llama-3.1-Nemotron-Ultra-253B.
#
# Translated from llama.cpp at commit 52b3df0023659b142ce29f75c7a82cf437769c33:
#   src/models/deci.cpp       load_arch_tensors, and the graph in graph::graph
#   src/llama-graph.cpp       build_inp_embd, build_norm, build_qkv, build_attn,
#                             build_attn_mha, build_ffn, build_lora_mm
#   src/llama-kv-cache.cpp    the constructor, cpy_k, cpy_v, get_k, get_v,
#                             build_input_k_rot
#   src/llama-model.cpp       create_tensor_qkv, llama_model_rope_type,
#                             llama_model::get_rope_factors
#   conversion/deci.py        how the converter writes each kind of layer
#
# The file gives head_count, head_count_kv and feed_forward_length as arrays, one entry
# per layer, and every layer is one of four kinds:
#   n_head > 0, n_head_kv > 0   self-attention, as in llama
#   n_head > 0, n_head_kv == 0  "linear attention": the output projection alone,
#                               n_embd by n_embd, in place of attention, with no KV
#   n_head == 0                 no attention: the layer's input goes straight to the FFN
#   n_ff == 0                   no FFN; Ultra's dummy layers have neither, and pass
#                               their input through
# The layer's symbols n_head, n_head_kv, n_ff, n_embd_k_gqa and n_embd_v_gqa read that
# layer's entry, so every condition below is per layer.
#
# For a layer with no FFN, deci.cpp's `continue` skips `inpL = cur`, so the layer's
# attention output is dropped. No released model attends in such a layer: in
# Nemotron-51B, Super-49B and Ultra-253B every FFN-free layer is also attention-free.
# This layout follows the C++ anyway, so the output projection of such a layer would be
# computed and never read; ggml would leave it out of its graph.
#
# Ops are listed in the order the C++ creates them, which is a valid execution order.
# ggml's own node order, from ggml_build_forward_expand, interleaves independent chains a
# little differently (it expands Q, then V, then K before the KV writes).
#
# Attention is ggml_flash_attn_ext, llama.cpp's flash-attention path. It is the one path
# that can read a quantized V cache, and with it llama.cpp keeps the V cache
# untransposed, so K and V are written and read the same way. LoRA adapters, control
# vectors (build_cvec), NVFP4 sidecar scales (*.scale) and LongRoPE factor tensors
# (rope_factors_long and _short, which load_arch_tensors creates in place of rope_freqs
# when rope.scaling.type is longrope) are not part of this layout.

schema_version = 1
arch = "deci"
description = "DeciLM and Llama-Nemotron NAS: llama with per-layer head counts and FFN widths, linear-attention, attention-free and FFN-free layers"
outputs = ["result_output"]

# Every ggml_rope_ext call in the graph passes llm_graph_context's members, which
# llama-context.cpp fills from the model's hparams.
defaults.rope.n_dims = "n_rot"
defaults.rope.mode = "norm"              # llama_model_rope_type: LLM_ARCH_DECI is NORM
defaults.rope.n_ctx_orig = "n_ctx_orig"
defaults.rope.freq_base = "freq_base"
defaults.rope.freq_scale = "freq_scale"
defaults.rope.ext_factor = "ext_factor"
defaults.rope.attn_factor = "attn_factor"
defaults.rope.beta_fast = "beta_fast"
defaults.rope.beta_slow = "beta_slow"

# llama_model_deci::load_arch_tensors. Inside its layer loop, n_head, n_head_kv, n_ff,
# n_embd_k_gqa and n_embd_v_gqa are that layer's values; n_embd_head_k and n_rot are the
# model's.
weights = [
  { name = "token_embd.weight", dims = ["n_embd", "n_vocab"] },
  { name = "output_norm.weight", dims = ["n_embd"] },
  # TENSOR_NOT_REQUIRED, then TENSOR_DUPLICATED from the token embeddings: a tied
  # model has no output.weight, and the LM head reads token_embd.weight instead.
  { name = "output.weight", dims = ["n_embd", "n_vocab"], fallback = "token_embd.weight" },
  # Llama 3.1's rope frequency factors. One tensor serves every layer: llama.cpp
  # creates it for layer 0 and marks the rest TENSOR_DUPLICATED.
  { name = "rope_freqs.weight", dims = ["n_rot / 2"], optional = true },

  # Both attention branches create attn_norm and the output projection: the linear one
  # (n_head_kv == 0 && n_head > 0) as n_embd by n_embd, the self-attention one
  # (n_head_kv > 0) as n_embd_head_k * n_head by n_embd. A weight is declared once, so
  # the two shapes are one dims expression.
  { name = "blk.{L}.attn_norm.weight", dims = ["n_embd"], when = "(n_head_kv == 0 && n_head > 0) || n_head_kv > 0" },
  # create_tensor_qkv(layer, i, n_embd, n_embd_head_k * n_head, n_embd_k_gqa,
  # n_embd_v_gqa, 0), in self-attention layers only: one fused QKV weight when the file
  # has it, else Q, K and V, each with an optional bias.
  { name = "blk.{L}.attn_qkv.weight", dims = ["n_embd", "n_embd_head_k * n_head + n_embd_k_gqa + n_embd_v_gqa"], optional = true, when = "n_head_kv > 0" },
  { name = "blk.{L}.attn_qkv.bias", dims = ["n_embd_head_k * n_head + n_embd_k_gqa + n_embd_v_gqa"], optional = true, when = "n_head_kv > 0 && has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_q.weight", dims = ["n_embd", "n_embd_head_k * n_head"], when = "n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_k.weight", dims = ["n_embd", "n_embd_k_gqa"], when = "n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_v.weight", dims = ["n_embd", "n_embd_v_gqa"], when = "n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_q.bias", dims = ["n_embd_head_k * n_head"], optional = true, when = "n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_k.bias", dims = ["n_embd_k_gqa"], optional = true, when = "n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_v.bias", dims = ["n_embd_v_gqa"], optional = true, when = "n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_output.weight", dims = ["n_head_kv == 0 ? n_embd : n_embd_head_k * n_head", "n_embd"], when = "(n_head_kv == 0 && n_head > 0) || n_head_kv > 0" },
  # TENSOR_NOT_REQUIRED in every layer, but only build_attn reads it. llama.cpp would
  # load and ignore one in a linear or attention-free layer; bind refuses that file as
  # a tensor no op reads. No released model has one.
  { name = "blk.{L}.attn_output.bias", dims = ["n_embd"], optional = true },

  # The FFN, in layers with n_ff > 0, and its optional biases.
  { name = "blk.{L}.ffn_norm.weight", dims = ["n_embd"], when = "n_ff > 0" },
  { name = "blk.{L}.ffn_gate.weight", dims = ["n_embd", "n_ff"], when = "n_ff > 0" },
  { name = "blk.{L}.ffn_down.weight", dims = ["n_ff", "n_embd"], when = "n_ff > 0" },
  { name = "blk.{L}.ffn_up.weight", dims = ["n_embd", "n_ff"], when = "n_ff > 0" },
  { name = "blk.{L}.ffn_gate.bias", dims = ["n_ff"], optional = true },
  { name = "blk.{L}.ffn_down.bias", dims = ["n_embd"], optional = true },
  { name = "blk.{L}.ffn_up.bias", dims = ["n_ff"], optional = true },
]

tensors = [
  # build_inp_embd: the token ids of this step.
  { name = "inp_tokens", kind = "input", dtype = "i32", dims = ["n_tokens"] },
  # build_inp_pos: one position per token.
  { name = "inp_pos", kind = "input", dtype = "i32", dims = ["n_tokens"] },
  # build_attn_inp_kv: the cache rows this step writes (build_input_k_idxs and
  # build_input_v_idxs; one index per token, since V is not transposed) and the mask,
  # which is f16 because flash attention needs it.
  { name = "inp_k_idxs", kind = "input", dtype = "i64", dims = ["n_tokens"] },
  { name = "inp_v_idxs", kind = "input", dtype = "i64", dims = ["n_tokens"] },
  { name = "attn_inp_kq_mask", kind = "input", dtype = "f16", dims = ["n_kv", "n_tokens", 1, 1] },
  # build_input_k_rot and build_input_v_rot: Hadamard matrices, present only when the
  # cache is quantized and the head width divides by 64. The head width is the model's,
  # the same in every layer.
  { name = "attn_inp_k_rot", kind = "input", dtype = "f32", dims = ["n_attn_rot_k", "n_attn_rot_k"], when = "attn_rot_k" },
  { name = "attn_inp_v_rot", kind = "input", dtype = "f32", dims = ["n_attn_rot_v", "n_attn_rot_v"], when = "attn_rot_v" },
  # build_inp_out_ids: the rows whose logits the step returns.
  { name = "inp_out_ids", kind = "input", dtype = "i32", dims = ["n_outputs"] },
  # llama_kv_cache's layers[il].k and .v: one stream of n_ctx cells per layer. The
  # constructor makes a cache for every layer, n_embd_k_gqa(il) wide, which is 0 in a
  # layer with no KV heads; leaving those out changes no byte.
  { name = "cache_k_l{L}", kind = "kv", dtype = "kv_k", dims = ["n_embd_k_gqa", "n_ctx"], when = "n_head_kv > 0" },
  { name = "cache_v_l{L}", kind = "kv", dtype = "kv_v", dims = ["n_embd_v_gqa", "n_ctx"], when = "n_head_kv > 0" },
]

prologue = [
  # build_inp_embd: the embedding rows of this step's tokens.
  { op = "get_rows", in = ["token_embd.weight", "inp_tokens"], out = "inpL" },
]

block = [
  # deci.cpp: an attention-free layer (n_head == 0) sets cur = inpL; any other layer
  # starts with build_norm(inpL, attn_norm, NULL, LLM_NORM_RMS).
  { op = "rms_norm", when = "n_head > 0", in = ["inpL"], out = "norm", eps = "f_norm_rms_eps" },
  { op = "mul", when = "n_head > 0", in = ["norm", "blk.{L}.attn_norm.weight"], out = "attn_norm" },

  # deci.cpp, "linear attention" (n_head > 0 && n_head_kv == 0): build_lora_mm(wo, cur).
  # No bias, and no KV cache.
  { op = "mul_mat", when = "n_head > 0 && n_head_kv == 0", in = ["blk.{L}.attn_output.weight", "attn_norm"], out = "attn_out" },

  # Self-attention (n_head > 0 && n_head_kv > 0), the rest of the block's attention.
  # build_qkv, fused path: one matmul, then Q, K and V as views of its rows.
  { op = "mul_mat", when = "n_head > 0 && n_head_kv > 0 && has(blk.{L}.attn_qkv.weight)", in = ["blk.{L}.attn_qkv.weight", "attn_norm"], out = "wqkv" },
  { op = "add", when = "n_head > 0 && n_head_kv > 0 && has(blk.{L}.attn_qkv.bias)", in = ["wqkv", "blk.{L}.attn_qkv.bias"], out = "wqkv" },
  { op = "view", when = "n_head > 0 && n_head_kv > 0 && has(blk.{L}.attn_qkv.weight)", in = ["wqkv"], out = "Qcur", ne = ["n_embd_head_v", "n_head", "n_tokens"], nb = ["row_size(n_embd_head_v)", "src.nb1"], offset = 0 },
  { op = "view", when = "n_head > 0 && n_head_kv > 0 && has(blk.{L}.attn_qkv.weight)", in = ["wqkv"], out = "Kcur", ne = ["n_embd_head_v", "n_head_kv", "n_tokens"], nb = ["row_size(n_embd_head_v)", "src.nb1"], offset = "row_size(n_embd_head_v * n_head)" },
  { op = "view", when = "n_head > 0 && n_head_kv > 0 && has(blk.{L}.attn_qkv.weight)", in = ["wqkv"], out = "Vcur", ne = ["n_embd_head_v", "n_head_kv", "n_tokens"], nb = ["row_size(n_embd_head_v)", "src.nb1"], offset = "row_size(n_embd_head_v * n_head + n_embd_head_v * n_head_kv)" },

  # build_qkv, separate path: three matmuls, each with an optional bias, then a
  # reshape to [head width, heads, tokens].
  { op = "mul_mat", when = "n_head > 0 && n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)", in = ["blk.{L}.attn_q.weight", "attn_norm"], out = "Qcur" },
  { op = "add", when = "has(blk.{L}.attn_q.bias)", in = ["Qcur", "blk.{L}.attn_q.bias"], out = "Qcur" },
  { op = "mul_mat", when = "n_head > 0 && n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)", in = ["blk.{L}.attn_k.weight", "attn_norm"], out = "Kcur" },
  { op = "add", when = "has(blk.{L}.attn_k.bias)", in = ["Kcur", "blk.{L}.attn_k.bias"], out = "Kcur" },
  { op = "mul_mat", when = "n_head > 0 && n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)", in = ["blk.{L}.attn_v.weight", "attn_norm"], out = "Vcur" },
  { op = "add", when = "has(blk.{L}.attn_v.bias)", in = ["Vcur", "blk.{L}.attn_v.bias"], out = "Vcur" },
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)", in = ["Qcur"], out = "Qcur", ne = ["n_embd_head_v", "n_head", "n_tokens"] },
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)", in = ["Kcur"], out = "Kcur", ne = ["n_embd_head_v", "n_head_kv", "n_tokens"] },
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && !has(blk.{L}.attn_qkv.weight)", in = ["Vcur"], out = "Vcur", ne = ["n_embd_head_v", "n_head_kv", "n_tokens"] },

  # deci.cpp: rope Q and K, with Llama 3.1's frequency factors when the file has them
  # (get_rope_factors returns rope_freqs, or NULL for older models).
  { op = "rope", when = "n_head > 0 && n_head_kv > 0", in = ["Qcur", "inp_pos", "rope_freqs.weight?"], out = "Qcur" },
  { op = "rope", when = "n_head > 0 && n_head_kv > 0", in = ["Kcur", "inp_pos", "rope_freqs.weight?"], out = "Kcur" },

  # build_attn: with a quantized cache, rotate Q, K and V by a Hadamard matrix before
  # the KV write (ggml_mul_mat_aux). Q and K share the K rotation, so Q.K is unchanged.
  # ggml_mul_mat_aux reshapes a contiguous input and copies a strided one, which is
  # why V takes cont on the fused path.
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && attn_rot_k", in = ["Qcur"], out = "Qrot", ne = ["n_attn_rot_k", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_k"] },
  { op = "mul_mat", when = "n_head > 0 && n_head_kv > 0 && attn_rot_k", in = ["attn_inp_k_rot", "Qrot"], out = "Qrot", hint = "src0_is_hadamard" },
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && attn_rot_k", in = ["Qrot"], out = "Qcur", ne = ["n_embd_head_k", "n_head", "n_tokens"] },
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && attn_rot_k", in = ["Kcur"], out = "Krot", ne = ["n_attn_rot_k", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_k"] },
  { op = "mul_mat", when = "n_head > 0 && n_head_kv > 0 && attn_rot_k", in = ["attn_inp_k_rot", "Krot"], out = "Krot", hint = "src0_is_hadamard" },
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && attn_rot_k", in = ["Krot"], out = "Kcur", ne = ["n_embd_head_k", "n_head_kv", "n_tokens"] },
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && attn_rot_v && !has(blk.{L}.attn_qkv.weight)", in = ["Vcur"], out = "Vrot", ne = ["n_attn_rot_v", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_v"] },
  { op = "cont", when = "n_head > 0 && n_head_kv > 0 && attn_rot_v && has(blk.{L}.attn_qkv.weight)", in = ["Vcur"], out = "Vrot", ne = ["n_attn_rot_v", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_v"] },
  { op = "mul_mat", when = "n_head > 0 && n_head_kv > 0 && attn_rot_v", in = ["attn_inp_v_rot", "Vrot"], out = "Vrot", hint = "src0_is_hadamard" },
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && attn_rot_v", in = ["Vrot"], out = "Vcur", ne = ["n_embd_head_v", "n_head_kv", "n_tokens"] },

  # llama_kv_cache::cpy_k: merge the heads into one row per token, then write this
  # step's rows into the cache at inp_k_idxs. set_rows returns a view of the cache.
  { op = "view", when = "n_head > 0 && n_head_kv > 0", in = ["Kcur"], out = "k_cur", ne = ["n_embd_k_gqa", "n_tokens"], nb = ["src.nb2"] },
  { op = "set_rows", when = "n_head > 0 && n_head_kv > 0", in = ["cache_k_l{L}", "k_cur", "inp_k_idxs"], out = "k_cache" },
  # llama_kv_cache::cpy_v, the untransposed branch taken with flash attention.
  { op = "view", when = "n_head > 0 && n_head_kv > 0", in = ["Vcur"], out = "v_cur", ne = ["n_embd_v_gqa", "n_tokens"], nb = ["src.nb2"] },
  { op = "set_rows", when = "n_head > 0 && n_head_kv > 0", in = ["cache_v_l{L}", "v_cur", "inp_v_idxs"], out = "v_cache" },

  # llama_kv_cache::get_k and get_v: the cache as [head width, KV heads, cells].
  # llama.cpp views the cache tensor itself and relies on graph order; reading the
  # set_rows result instead says outright that the read comes after the write.
  { op = "view", when = "n_head > 0 && n_head_kv > 0", in = ["k_cache"], out = "k", ne = ["n_embd_head_k", "n_head_kv", "n_kv", 1], nb = ["row_size(n_embd_head_k)", "row_size(n_embd_k_gqa)", "row_size(n_embd_k_gqa * n_ctx)"] },
  { op = "view", when = "n_head > 0 && n_head_kv > 0", in = ["v_cache"], out = "v", ne = ["n_embd_head_v", "n_head_kv", "n_kv", 1], nb = ["row_size(n_embd_head_v)", "row_size(n_embd_v_gqa)", "row_size(n_embd_v_gqa * n_ctx)"] },

  # build_attn_mha: one stream, so the first view is all of Q; then heads to dim 2.
  { op = "view", when = "n_head > 0 && n_head_kv > 0", in = ["Qcur"], out = "q", ne = ["src.ne0", "src.ne1", "src.ne2", 1], nb = ["src.nb1", "src.nb2", "src.nb3"] },
  { op = "permute", when = "n_head > 0 && n_head_kv > 0", in = ["q"], out = "q", axes = [0, 2, 1, 3] },
  { op = "permute", when = "n_head > 0 && n_head_kv > 0", in = ["k"], out = "k", axes = [0, 2, 1, 3] },
  { op = "permute", when = "n_head > 0 && n_head_kv > 0", in = ["v"], out = "v", axes = [0, 2, 1, 3] },
  # Flash attention reads f16 or quantized K and V; an f32 cache is cast to f16 first.
  { op = "cpy", when = "n_head > 0 && n_head_kv > 0 && kv_k_f32", in = ["k"], out = "k", type = "f16" },
  { op = "cpy", when = "n_head > 0 && n_head_kv > 0 && kv_v_f32", in = ["v"], out = "v", type = "f16" },
  # deci.cpp's kq_scale is f_attention_scale when set, else 1/sqrt(n_embd_head). deci
  # never reads attention.scale, so it is always the latter. max_bias and logit_softcap
  # stay 0, as deci reads neither. build_attn_mha sets F32 precision.
  { op = "flash_attn_ext", when = "n_head > 0 && n_head_kv > 0", in = ["q", "k", "v", "attn_inp_kq_mask"], out = "__fattn__", scale = "1 / sqrt(n_embd_head_v)", prec = "f32" },
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0", in = ["__fattn__"], out = "kqv_out", ne = ["src.ne0 * src.ne1", "src.ne2 * src.ne3"] },

  # build_attn: undo the V rotation on the attention output, then project, with the
  # optional output bias.
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && attn_rot_v", in = ["kqv_out"], out = "kqv_rot", ne = ["n_attn_rot_v", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_v"] },
  { op = "mul_mat", when = "n_head > 0 && n_head_kv > 0 && attn_rot_v", in = ["attn_inp_v_rot", "kqv_rot"], out = "kqv_rot", hint = "src0_is_hadamard" },
  { op = "reshape", when = "n_head > 0 && n_head_kv > 0 && attn_rot_v", in = ["kqv_rot"], out = "kqv_out", ne = ["n_embd_head_v * n_head", "n_tokens"] },
  { op = "mul_mat", when = "n_head > 0 && n_head_kv > 0", in = ["blk.{L}.attn_output.weight", "kqv_out"], out = "attn_out" },
  { op = "add", when = "n_head > 0 && n_head_kv > 0 && has(blk.{L}.attn_output.bias)", in = ["attn_out", "blk.{L}.attn_output.bias"], out = "attn_out" },

  # The last layer keeps only the rows whose logits are wanted, from here on: cur, which
  # is attn_out, or inpL in an attention-free layer; and inpSA, which is inpL under
  # another name. In an attention-free layer the two gathers are one, since the C++
  # makes two get_rows of inpL and reads only the first. In a layer with no FFN the
  # `continue` leaves inpL as it was, so it is not gathered.
  { op = "get_rows", when = "L == n_layer - 1 && n_head > 0", in = ["attn_out", "inp_out_ids"], out = "attn_out" },
  { op = "get_rows", when = "L == n_layer - 1 && n_ff > 0", in = ["inpL", "inp_out_ids"], out = "inpL" },

  # deci.cpp: a layer with no FFN ends here, at `continue`, and inpL carries on. Else
  # ffn_inp is cur + inpSA in a layer that attended, and cur itself, which is inpL, in an
  # attention-free one. The two ops that read ffn_inp are written twice for that reason.
  { op = "add", when = "n_ff > 0 && n_head > 0", in = ["attn_out", "inpL"], out = "ffn_inp" },

  # build_norm(ffn_inp, ffn_norm, NULL, LLM_NORM_RMS). ffn_gate_inp is never created,
  # so the dense FFN always runs.
  { op = "rms_norm", when = "n_ff > 0 && n_head > 0", in = ["ffn_inp"], out = "norm", eps = "f_norm_rms_eps" },
  { op = "rms_norm", when = "n_ff > 0 && n_head == 0", in = ["inpL"], out = "norm", eps = "f_norm_rms_eps" },
  { op = "mul", when = "n_ff > 0", in = ["norm", "blk.{L}.ffn_norm.weight"], out = "ffn_norm" },

  # build_ffn(up, gate, down, LLM_FFN_SILU, LLM_FFN_PAR), each with its optional bias.
  { op = "mul_mat", when = "n_ff > 0", in = ["blk.{L}.ffn_up.weight", "ffn_norm"], out = "ffn_up" },
  { op = "add", when = "has(blk.{L}.ffn_up.bias)", in = ["ffn_up", "blk.{L}.ffn_up.bias"], out = "ffn_up" },
  { op = "mul_mat", when = "n_ff > 0", in = ["blk.{L}.ffn_gate.weight", "ffn_norm"], out = "ffn_gate" },
  { op = "add", when = "has(blk.{L}.ffn_gate.bias)", in = ["ffn_gate", "blk.{L}.ffn_gate.bias"], out = "ffn_gate" },
  { op = "swiglu", when = "n_ff > 0", in = ["ffn_gate", "ffn_up"], out = "ffn_swiglu" },
  { op = "mul_mat", when = "n_ff > 0", in = ["blk.{L}.ffn_down.weight", "ffn_swiglu"], out = "ffn_out" },
  { op = "add", when = "has(blk.{L}.ffn_down.bias)", in = ["ffn_out", "blk.{L}.ffn_down.bias"], out = "ffn_out" },

  # The residual over ffn_inp; the result is the next layer's input.
  { op = "add", when = "n_ff > 0 && n_head > 0", in = ["ffn_out", "ffn_inp"], out = "inpL" },
  { op = "add", when = "n_ff > 0 && n_head == 0", in = ["ffn_out", "inpL"], out = "inpL" },
]

epilogue = [
  # build_norm(inpL, output_norm, NULL, LLM_NORM_RMS, -1)
  { op = "rms_norm", in = ["inpL"], out = "norm", eps = "f_norm_rms_eps" },
  { op = "mul", in = ["norm", "output_norm.weight"], out = "result_norm" },
  # build_lora_mm(output): the LM head, which is token_embd.weight in a tied model.
  { op = "mul_mat", in = ["output.weight", "result_norm"], out = "result_output" },
]
