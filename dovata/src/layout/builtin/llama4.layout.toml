# llama4: the Llama 4 mixture-of-experts transformer, Llama 4 Scout (17B-16E) and
# Llama 4 Maverick (17B-128E).
#
# Translated from llama.cpp at commit 52b3df0023659b142ce29f75c7a82cf437769c33:
#   src/models/llama4.cpp        load_arch_hparams, load_arch_tensors, and the graph in
#                                graph<iswa>::graph
#   src/llama-graph.cpp          build_inp_embd, build_inp_attn_scale, build_attn_inp_kv,
#                                build_attn_inp_kv_iswa, build_norm, build_qkv,
#                                build_attn (the kv and kv_iswa forms), build_attn_mha,
#                                build_ffn, build_moe_ffn, build_lora_mm
#   src/llama-kv-cache.cpp       cpy_k, cpy_v, get_k, get_v, build_input_k_rot
#   src/llama-kv-cache-iswa.cpp  the second cache, for the chunked layers
#   src/llama-hparams.cpp        set_swa_pattern, is_swa
#   src/llama-model.cpp          create_tensor_qkv, llama_model_rope_type,
#                                llama_model::get_rope_freq_base, get_rope_freq_scale
#                                and get_rope_factors
#
# Two patterns run through the layers, and in current models they line up. With the
# default period of 4, three of every four layers rope Q and K and attend in chunks of
# n_swa tokens; every fourth layer has no rope (NoPE), scales Q by a temperature that
# grows with the position instead, and attends over the whole context. Separately,
# every n_moe_layer_step-th layer has experts and the others a dense SwiGLU FFN: Scout
# has experts in every layer, Maverick in every second one.
#
# Chunked attention. llama.cpp keeps the chunked layers' KV in a second cache
# (llama_kv_cache_iswa), with its own write indices, its own mask and its own rotation
# matrices. The layout declares those inputs twice, the second set named *_swa, and
# writes each op that reads one of them twice under complementary `is_swa` conditions,
# because build_attn picks one or the other per layer. The KV tensors stay one per
# layer; a chunked layer's is n_ctx_swa cells long. n_ctx_swa is n_ctx, the size
# llama.cpp gives the SWA cache with swa_full, its library default. llama-cli and
# llama-server default to swa_full = false, which sizes it GGML_PAD(min(n_ctx, n_swa +
# n_ubatch), 256); that size needs n_ubatch, which the bind options do not carry.
#
# The program fills the inputs. A chunked layer's token at position p sees the cells
# from floor(p / n_swa) * n_swa up to p (llama_hparams::is_masked_swa), and
# inp_attn_scale holds log(floor((p + 1) / 8192) + 1) * 0.1 + 1 per token
# (llm_graph_input_attn_temp::set_input, with the constants load_arch_hparams sets).
# A file with attention.sliding_window = 0 has no chunked layers, one cache, and NoPE
# only on its last layer; load_arch_hparams sets no temperature constants for it, so
# llama.cpp's own set_input asserts on such a file.
#
# Ops are listed in the order the C++ creates them, which is a valid execution order.
# ggml's own node order, from ggml_build_forward_expand, interleaves independent
# chains a little differently.
#
# Attention is ggml_flash_attn_ext, llama.cpp's flash-attention path. It is the one
# path that can read a quantized V cache, and with it llama.cpp keeps the V cache
# untransposed, so K and V are written and read the same way. LoRA adapters, control
# vectors (build_cvec) and NVFP4 sidecar scales (*.scale) are not part of this layout.

schema_version = 1
arch = "llama4"
description = "Llama 4: GQA attention, chunked with normal rope and Q/K L2 norm on three of four layers, NoPE with a Q temperature on the fourth; sigmoid-routed experts with a shared expert, interleaved with dense FFNs"
outputs = ["result_output"]

# Every ggml_rope_ext call in the graph passes llm_graph_context's members, which
# llama-context.cpp fills from the model's hparams, except the frequency base and
# scale: llama_model::get_rope_freq_base and get_rope_freq_scale give a chunked layer
# the SWA values.
defaults.rope.n_dims = "n_rot"
defaults.rope.mode = "norm"              # llama_model_rope_type: LLM_ARCH_LLAMA4 is NORM
defaults.rope.n_ctx_orig = "n_ctx_orig"
defaults.rope.freq_base = "is_swa ? freq_base_swa : freq_base"
defaults.rope.freq_scale = "is_swa ? freq_scale_swa : freq_scale"
defaults.rope.ext_factor = "ext_factor"
defaults.rope.attn_factor = "attn_factor"
defaults.rope.beta_fast = "beta_fast"
defaults.rope.beta_slow = "beta_slow"

# llama_model_llama4::load_arch_tensors
weights = [
  { name = "token_embd.weight", dims = ["n_embd", "n_vocab"] },
  { name = "output_norm.weight", dims = ["n_embd"] },
  # TENSOR_NOT_REQUIRED, then TENSOR_DUPLICATED from the token embeddings: a tied
  # model has no output.weight, and the LM head reads token_embd.weight instead.
  { name = "output.weight", dims = ["n_embd", "n_vocab"], fallback = "token_embd.weight" },
  # Llama 3 style rope frequency factors, which Scout's files have and Maverick's do
  # not. One tensor serves every layer: llama.cpp creates it for layer 0 and marks the
  # rest TENSOR_DUPLICATED.
  { name = "rope_freqs.weight", dims = ["n_rot / 2"], optional = true },

  { name = "blk.{L}.attn_norm.weight", dims = ["n_embd"] },
  # create_tensor_qkv: one fused QKV weight when the file has it, else Q, K and V,
  # each with an optional bias.
  { name = "blk.{L}.attn_qkv.weight", dims = ["n_embd", "n_embd_head_k * n_head + n_embd_k_gqa + n_embd_v_gqa"], optional = true },
  { name = "blk.{L}.attn_qkv.bias", dims = ["n_embd_head_k * n_head + n_embd_k_gqa + n_embd_v_gqa"], optional = true, when = "has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_q.weight", dims = ["n_embd", "n_embd_head_k * n_head"], when = "!has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_k.weight", dims = ["n_embd", "n_embd_k_gqa"], when = "!has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_v.weight", dims = ["n_embd", "n_embd_v_gqa"], when = "!has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_q.bias", dims = ["n_embd_head_k * n_head"], optional = true, when = "!has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_k.bias", dims = ["n_embd_k_gqa"], optional = true, when = "!has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_v.bias", dims = ["n_embd_v_gqa"], optional = true, when = "!has(blk.{L}.attn_qkv.weight)" },
  { name = "blk.{L}.attn_output.weight", dims = ["n_embd_head_k * n_head", "n_embd"] },

  { name = "blk.{L}.ffn_norm.weight", dims = ["n_embd"] },
  # is_moe_layer: n_moe_layer_step > 0 && (i + 1) % n_moe_layer_step == 0. Routed
  # experts, each n_ff_exp wide.
  { name = "blk.{L}.ffn_gate_inp.weight", dims = ["n_embd", "n_expert"], when = "n_moe_layer_step > 0 && (L + 1) % n_moe_layer_step == 0" },
  { name = "blk.{L}.ffn_gate_exps.weight", dims = ["n_embd", "n_ff_exp", "n_expert"], when = "n_moe_layer_step > 0 && (L + 1) % n_moe_layer_step == 0" },
  { name = "blk.{L}.ffn_down_exps.weight", dims = ["n_ff_exp", "n_embd", "n_expert"], when = "n_moe_layer_step > 0 && (L + 1) % n_moe_layer_step == 0" },
  { name = "blk.{L}.ffn_up_exps.weight", dims = ["n_embd", "n_ff_exp", "n_expert"], when = "n_moe_layer_step > 0 && (L + 1) % n_moe_layer_step == 0" },
  # The shared expert: n_ff_shexp is n_ff_exp.
  { name = "blk.{L}.ffn_gate_shexp.weight", dims = ["n_embd", "n_ff_exp"], when = "n_moe_layer_step > 0 && (L + 1) % n_moe_layer_step == 0" },
  { name = "blk.{L}.ffn_down_shexp.weight", dims = ["n_ff_exp", "n_embd"], when = "n_moe_layer_step > 0 && (L + 1) % n_moe_layer_step == 0" },
  { name = "blk.{L}.ffn_up_shexp.weight", dims = ["n_embd", "n_ff_exp"], when = "n_moe_layer_step > 0 && (L + 1) % n_moe_layer_step == 0" },
  # The other layers: a dense FFN, n_ff wide.
  { name = "blk.{L}.ffn_gate.weight", dims = ["n_embd", "n_ff"], when = "!(n_moe_layer_step > 0 && (L + 1) % n_moe_layer_step == 0)" },
  { name = "blk.{L}.ffn_down.weight", dims = ["n_ff", "n_embd"], when = "!(n_moe_layer_step > 0 && (L + 1) % n_moe_layer_step == 0)" },
  { name = "blk.{L}.ffn_up.weight", dims = ["n_embd", "n_ff"], when = "!(n_moe_layer_step > 0 && (L + 1) % n_moe_layer_step == 0)" },
]

tensors = [
  # build_inp_embd: the token ids of this step.
  { name = "inp_tokens", kind = "input", dtype = "i32", dims = ["n_tokens"] },
  # build_inp_pos: one position per token.
  { name = "inp_pos", kind = "input", dtype = "i32", dims = ["n_tokens"] },
  # build_inp_attn_scale: the NoPE layers' Q temperature, one per token. It is 1x1xN so
  # that it broadcasts over the head width and the heads.
  { name = "inp_attn_scale", kind = "input", dtype = "f32", dims = [1, 1, "n_tokens"] },
  # build_attn_inp_kv, or the base half of build_attn_inp_kv_iswa: the cache rows this
  # step writes (one index per token, since V is not transposed) and the mask, which is
  # f16 because flash attention needs it.
  { name = "inp_k_idxs", kind = "input", dtype = "i64", dims = ["n_tokens"] },
  { name = "inp_v_idxs", kind = "input", dtype = "i64", dims = ["n_tokens"] },
  { name = "attn_inp_kq_mask", kind = "input", dtype = "f16", dims = ["n_kv", "n_tokens", 1, 1] },
  # build_input_k_rot and build_input_v_rot: Hadamard matrices, present only when the
  # cache is quantized and the head width divides by 64.
  { name = "attn_inp_k_rot", kind = "input", dtype = "f32", dims = ["n_attn_rot_k", "n_attn_rot_k"], when = "attn_rot_k" },
  { name = "attn_inp_v_rot", kind = "input", dtype = "f32", dims = ["n_attn_rot_v", "n_attn_rot_v"], when = "attn_rot_v" },
  # The SWA half of build_attn_inp_kv_iswa. The chunked layers' cache is a second
  # llama_kv_cache with its own cells, so it has its own write indices, mask and
  # rotation matrices. A file that turns chunked attention off has none of them.
  { name = "inp_k_idxs_swa", kind = "input", dtype = "i64", dims = ["n_tokens"], when = "n_swa > 0" },
  { name = "inp_v_idxs_swa", kind = "input", dtype = "i64", dims = ["n_tokens"], when = "n_swa > 0" },
  { name = "attn_inp_kq_mask_swa", kind = "input", dtype = "f16", dims = ["n_kv_swa", "n_tokens", 1, 1], when = "n_swa > 0" },
  { name = "attn_inp_k_rot_swa", kind = "input", dtype = "f32", dims = ["n_attn_rot_k", "n_attn_rot_k"], when = "n_swa > 0 && attn_rot_k" },
  { name = "attn_inp_v_rot_swa", kind = "input", dtype = "f32", dims = ["n_attn_rot_v", "n_attn_rot_v"], when = "n_swa > 0 && attn_rot_v" },
  # build_inp_out_ids: the rows whose logits the step returns.
  { name = "inp_out_ids", kind = "input", dtype = "i32", dims = ["n_outputs"] },
  # llama_kv_cache's layers[il].k and .v, one stream per layer. A chunked layer's are in
  # the SWA cache, n_ctx_swa cells long; the others' are in the base cache, n_ctx long.
  { name = "cache_k_l{L}", kind = "kv", dtype = "kv_k", dims = ["n_embd_k_gqa", "is_swa ? n_ctx_swa : n_ctx"] },
  { name = "cache_v_l{L}", kind = "kv", dtype = "kv_v", dims = ["n_embd_v_gqa", "is_swa ? n_ctx_swa : n_ctx"] },
]

prologue = [
  # build_inp_embd: the embedding rows of this step's tokens.
  { op = "get_rows", in = ["token_embd.weight", "inp_tokens"], out = "inpL" },
]

block = [
  # build_norm(inpL, attn_norm, NULL, LLM_NORM_RMS)
  { op = "rms_norm", in = ["inpL"], out = "norm", eps = "f_norm_rms_eps" },
  { op = "mul", in = ["norm", "blk.{L}.attn_norm.weight"], out = "attn_norm" },

  # build_qkv, fused path: one matmul, then Q, K and V as views of its rows.
  { op = "mul_mat", when = "has(blk.{L}.attn_qkv.weight)", in = ["blk.{L}.attn_qkv.weight", "attn_norm"], out = "wqkv" },
  { op = "add", when = "has(blk.{L}.attn_qkv.bias)", in = ["wqkv", "blk.{L}.attn_qkv.bias"], out = "wqkv" },
  { op = "view", when = "has(blk.{L}.attn_qkv.weight)", in = ["wqkv"], out = "Qcur", ne = ["n_embd_head_v", "n_head", "n_tokens"], nb = ["row_size(n_embd_head_v)", "src.nb1"], offset = 0 },
  { op = "view", when = "has(blk.{L}.attn_qkv.weight)", in = ["wqkv"], out = "Kcur", ne = ["n_embd_head_v", "n_head_kv", "n_tokens"], nb = ["row_size(n_embd_head_v)", "src.nb1"], offset = "row_size(n_embd_head_v * n_head)" },
  { op = "view", when = "has(blk.{L}.attn_qkv.weight)", in = ["wqkv"], out = "Vcur", ne = ["n_embd_head_v", "n_head_kv", "n_tokens"], nb = ["row_size(n_embd_head_v)", "src.nb1"], offset = "row_size(n_embd_head_v * n_head + n_embd_head_v * n_head_kv)" },

  # build_qkv, separate path: three matmuls, each with an optional bias, then a
  # reshape to [head width, heads, tokens].
  { op = "mul_mat", when = "!has(blk.{L}.attn_qkv.weight)", in = ["blk.{L}.attn_q.weight", "attn_norm"], out = "Qcur" },
  { op = "add", when = "has(blk.{L}.attn_q.bias)", in = ["Qcur", "blk.{L}.attn_q.bias"], out = "Qcur" },
  { op = "mul_mat", when = "!has(blk.{L}.attn_qkv.weight)", in = ["blk.{L}.attn_k.weight", "attn_norm"], out = "Kcur" },
  { op = "add", when = "has(blk.{L}.attn_k.bias)", in = ["Kcur", "blk.{L}.attn_k.bias"], out = "Kcur" },
  { op = "mul_mat", when = "!has(blk.{L}.attn_qkv.weight)", in = ["blk.{L}.attn_v.weight", "attn_norm"], out = "Vcur" },
  { op = "add", when = "has(blk.{L}.attn_v.bias)", in = ["Vcur", "blk.{L}.attn_v.bias"], out = "Vcur" },
  { op = "reshape", when = "!has(blk.{L}.attn_qkv.weight)", in = ["Qcur"], out = "Qcur", ne = ["n_embd_head_v", "n_head", "n_tokens"] },
  { op = "reshape", when = "!has(blk.{L}.attn_qkv.weight)", in = ["Kcur"], out = "Kcur", ne = ["n_embd_head_v", "n_head_kv", "n_tokens"] },
  { op = "reshape", when = "!has(blk.{L}.attn_qkv.weight)", in = ["Vcur"], out = "Vcur", ne = ["n_embd_head_v", "n_head_kv", "n_tokens"] },

  # llama4.cpp: use_rope is n_no_rope_layer_step > 0 && (il + 1) % n_no_rope_layer_step
  # != 0. A rope layer ropes Q and K, with the frequency factors when the file has them
  # (get_rope_factors returns rope_freqs, or NULL for Maverick).
  { op = "rope", when = "n_no_rope_layer_step > 0 && (L + 1) % n_no_rope_layer_step != 0", in = ["Qcur", "inp_pos", "rope_freqs.weight?"], out = "Qcur" },
  { op = "rope", when = "n_no_rope_layer_step > 0 && (L + 1) % n_no_rope_layer_step != 0", in = ["Kcur", "inp_pos", "rope_freqs.weight?"], out = "Kcur" },
  # A NoPE layer scales Q by the attention temperature instead, and leaves K as it is.
  # llama.cpp tests inp_attn_scale, which build_inp_attn_scale always makes.
  { op = "mul", when = "!(n_no_rope_layer_step > 0 && (L + 1) % n_no_rope_layer_step != 0)", in = ["Qcur", "inp_attn_scale"], out = "Qcur" },
  # Llama4TextL2Norm on a rope layer: an RMS norm with no weight, after the rope.
  # hparams.use_kq_norm is type != LLM_TYPE_17B_128E, and load_arch_hparams gives that
  # type exactly when n_expert is 128, which is Maverick.
  { op = "rms_norm", when = "n_no_rope_layer_step > 0 && (L + 1) % n_no_rope_layer_step != 0 && n_expert != 128", in = ["Qcur"], out = "Qcur", eps = "f_norm_rms_eps" },
  { op = "rms_norm", when = "n_no_rope_layer_step > 0 && (L + 1) % n_no_rope_layer_step != 0 && n_expert != 128", in = ["Kcur"], out = "Kcur", eps = "f_norm_rms_eps" },

  # build_attn: with a quantized cache, rotate Q, K and V by a Hadamard matrix before
  # the KV write (ggml_mul_mat_aux). Q and K share the K rotation, so Q.K is unchanged.
  # A chunked layer reads the SWA cache's matrices, any other layer the base cache's.
  # ggml_mul_mat_aux reshapes a contiguous input and copies a strided one. Q is always
  # contiguous here, since a rope or a mul made it. K is contiguous after a rope, and on
  # a NoPE layer only on the separate path; on the fused path it is still a view of the
  # QKV rows, so K takes cont there, as V does.
  { op = "reshape", when = "attn_rot_k", in = ["Qcur"], out = "Qrot", ne = ["n_attn_rot_k", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_k"] },
  { op = "mul_mat", when = "attn_rot_k && !is_swa", in = ["attn_inp_k_rot", "Qrot"], out = "Qrot", hint = "src0_is_hadamard" },
  { op = "mul_mat", when = "attn_rot_k && is_swa", in = ["attn_inp_k_rot_swa", "Qrot"], out = "Qrot", hint = "src0_is_hadamard" },
  { op = "reshape", when = "attn_rot_k", in = ["Qrot"], out = "Qcur", ne = ["n_embd_head_k", "n_head", "n_tokens"] },
  { op = "reshape", when = "attn_rot_k && (n_no_rope_layer_step > 0 && (L + 1) % n_no_rope_layer_step != 0 || !has(blk.{L}.attn_qkv.weight))", in = ["Kcur"], out = "Krot", ne = ["n_attn_rot_k", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_k"] },
  { op = "cont", when = "attn_rot_k && !(n_no_rope_layer_step > 0 && (L + 1) % n_no_rope_layer_step != 0) && has(blk.{L}.attn_qkv.weight)", in = ["Kcur"], out = "Krot", ne = ["n_attn_rot_k", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_k"] },
  { op = "mul_mat", when = "attn_rot_k && !is_swa", in = ["attn_inp_k_rot", "Krot"], out = "Krot", hint = "src0_is_hadamard" },
  { op = "mul_mat", when = "attn_rot_k && is_swa", in = ["attn_inp_k_rot_swa", "Krot"], out = "Krot", hint = "src0_is_hadamard" },
  { op = "reshape", when = "attn_rot_k", in = ["Krot"], out = "Kcur", ne = ["n_embd_head_k", "n_head_kv", "n_tokens"] },
  { op = "reshape", when = "attn_rot_v && !has(blk.{L}.attn_qkv.weight)", in = ["Vcur"], out = "Vrot", ne = ["n_attn_rot_v", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_v"] },
  { op = "cont", when = "attn_rot_v && has(blk.{L}.attn_qkv.weight)", in = ["Vcur"], out = "Vrot", ne = ["n_attn_rot_v", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_v"] },
  { op = "mul_mat", when = "attn_rot_v && !is_swa", in = ["attn_inp_v_rot", "Vrot"], out = "Vrot", hint = "src0_is_hadamard" },
  { op = "mul_mat", when = "attn_rot_v && is_swa", in = ["attn_inp_v_rot_swa", "Vrot"], out = "Vrot", hint = "src0_is_hadamard" },
  { op = "reshape", when = "attn_rot_v", in = ["Vrot"], out = "Vcur", ne = ["n_embd_head_v", "n_head_kv", "n_tokens"] },

  # llama_kv_cache::cpy_k: merge the heads into one row per token, then write this
  # step's rows into the layer's cache at the indices of the cache it belongs to.
  # set_rows returns a view of the cache.
  { op = "view", in = ["Kcur"], out = "k_cur", ne = ["n_embd_k_gqa", "n_tokens"], nb = ["src.nb2"] },
  { op = "set_rows", when = "!is_swa", in = ["cache_k_l{L}", "k_cur", "inp_k_idxs"], out = "k_cache" },
  { op = "set_rows", when = "is_swa", in = ["cache_k_l{L}", "k_cur", "inp_k_idxs_swa"], out = "k_cache" },
  # llama_kv_cache::cpy_v, the untransposed branch taken with flash attention.
  { op = "view", in = ["Vcur"], out = "v_cur", ne = ["n_embd_v_gqa", "n_tokens"], nb = ["src.nb2"] },
  { op = "set_rows", when = "!is_swa", in = ["cache_v_l{L}", "v_cur", "inp_v_idxs"], out = "v_cache" },
  { op = "set_rows", when = "is_swa", in = ["cache_v_l{L}", "v_cur", "inp_v_idxs_swa"], out = "v_cache" },

  # llama_kv_cache::get_k and get_v: the cache as [head width, KV heads, cells], over
  # the cells of the cache the layer belongs to. llama.cpp views the cache tensor itself
  # and relies on graph order; reading the set_rows result instead says outright that
  # the read comes after the write.
  { op = "view", in = ["k_cache"], out = "k", ne = ["n_embd_head_k", "n_head_kv", "is_swa ? n_kv_swa : n_kv", 1], nb = ["row_size(n_embd_head_k)", "row_size(n_embd_k_gqa)", "row_size(n_embd_k_gqa * (is_swa ? n_ctx_swa : n_ctx))"] },
  { op = "view", in = ["v_cache"], out = "v", ne = ["n_embd_head_v", "n_head_kv", "is_swa ? n_kv_swa : n_kv", 1], nb = ["row_size(n_embd_head_v)", "row_size(n_embd_v_gqa)", "row_size(n_embd_v_gqa * (is_swa ? n_ctx_swa : n_ctx))"] },

  # build_attn_mha: one stream, so the first view is all of Q; then heads to dim 2.
  { op = "view", in = ["Qcur"], out = "q", ne = ["src.ne0", "src.ne1", "src.ne2", 1], nb = ["src.nb1", "src.nb2", "src.nb3"] },
  { op = "permute", in = ["q"], out = "q", axes = [0, 2, 1, 3] },
  { op = "permute", in = ["k"], out = "k", axes = [0, 2, 1, 3] },
  { op = "permute", in = ["v"], out = "v", axes = [0, 2, 1, 3] },
  # Flash attention reads f16 or quantized K and V; an f32 cache is cast to f16 first.
  { op = "cpy", when = "kv_k_f32", in = ["k"], out = "k", type = "f16" },
  { op = "cpy", when = "kv_v_f32", in = ["v"], out = "v", type = "f16" },
  # kq_scale is f_attention_scale when set, else 1/sqrt(n_embd_head). llama4 never
  # reads attention.scale, so it is always the latter. max_bias and logit_softcap stay
  # 0, as llama4 reads neither. A chunked layer reads the chunked mask. build_attn_mha
  # sets F32 precision.
  { op = "flash_attn_ext", when = "!is_swa", in = ["q", "k", "v", "attn_inp_kq_mask"], out = "__fattn__", scale = "1 / sqrt(n_embd_head_v)", prec = "f32" },
  { op = "flash_attn_ext", when = "is_swa", in = ["q", "k", "v", "attn_inp_kq_mask_swa"], out = "__fattn__", scale = "1 / sqrt(n_embd_head_v)", prec = "f32" },
  { op = "reshape", in = ["__fattn__"], out = "kqv_out", ne = ["src.ne0 * src.ne1", "src.ne2 * src.ne3"] },

  # build_attn: undo the V rotation on the attention output, then project. llama4 has
  # no output bias.
  { op = "reshape", when = "attn_rot_v", in = ["kqv_out"], out = "kqv_rot", ne = ["n_attn_rot_v", "src.ne0 * src.ne1 * src.ne2 * src.ne3 / n_attn_rot_v"] },
  { op = "mul_mat", when = "attn_rot_v && !is_swa", in = ["attn_inp_v_rot", "kqv_rot"], out = "kqv_rot", hint = "src0_is_hadamard" },
  { op = "mul_mat", when = "attn_rot_v && is_swa", in = ["attn_inp_v_rot_swa", "kqv_rot"], out = "kqv_rot", hint = "src0_is_hadamard" },
  { op = "reshape", when = "attn_rot_v", in = ["kqv_rot"], out = "kqv_out", ne = ["n_embd_head_v * n_head", "n_tokens"] },
  { op = "mul_mat", in = ["blk.{L}.attn_output.weight", "kqv_out"], out = "attn_out" },

  # The last layer keeps only the rows whose logits are wanted, from here on.
  # llama.cpp gathers inpSA, which is inpL under another name.
  { op = "get_rows", when = "L == n_layer - 1", in = ["attn_out", "inp_out_ids"], out = "attn_out" },
  { op = "get_rows", when = "L == n_layer - 1", in = ["inpL", "inp_out_ids"], out = "inpL" },
  { op = "add", in = ["attn_out", "inpL"], out = "ffn_inp" },

  # build_norm(ffn_inp, ffn_norm, NULL, LLM_NORM_RMS), on both FFN paths.
  { op = "rms_norm", in = ["ffn_inp"], out = "norm", eps = "f_norm_rms_eps" },
  { op = "mul", in = ["norm", "blk.{L}.ffn_norm.weight"], out = "ffn_norm" },

  # The dense path. llama.cpp's graph takes it when the layer has no ffn_gate_inp,
  # which load_arch_tensors creates exactly on the expert layers.
  # build_ffn(up, gate, down, LLM_FFN_SILU, LLM_FFN_PAR): one swiglu of gate over up.
  { op = "mul_mat", when = "!has(blk.{L}.ffn_gate_inp.weight)", in = ["blk.{L}.ffn_up.weight", "ffn_norm"], out = "ffn_up" },
  { op = "mul_mat", when = "!has(blk.{L}.ffn_gate_inp.weight)", in = ["blk.{L}.ffn_gate.weight", "ffn_norm"], out = "ffn_gate" },
  { op = "swiglu", when = "!has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_gate", "ffn_up"], out = "ffn_swiglu" },
  { op = "mul_mat", when = "!has(blk.{L}.ffn_gate_inp.weight)", in = ["blk.{L}.ffn_down.weight", "ffn_swiglu"], out = "ffn_out" },

  # The expert path: build_moe_ffn with sigmoid gating, norm_w = false, and no selection
  # bias. Shapes use src.ne*, because the last layer runs it over n_outputs rows.
  { op = "mul_mat", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["blk.{L}.ffn_gate_inp.weight", "ffn_norm"], out = "ffn_moe_logits" },
  { op = "sigmoid", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_moe_logits"], out = "ffn_moe_probs" },
  # For LLM_ARCH_LLAMA4, selection_probs is the logits: the experts are chosen on the
  # raw logits, and the sigmoid only weights them. ggml_argsort_top_k is a descending
  # argsort, viewed down to the first n_expert_used.
  { op = "argsort", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_moe_logits"], out = "ffn_moe_argsort", order = "desc" },
  { op = "view", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_moe_argsort"], out = "ffn_moe_topk", ne = ["n_expert_used", "src.ne1", "src.ne2", "src.ne3"], nb = ["src.nb1", "src.nb2", "src.nb3"] },
  { op = "reshape", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_moe_probs"], out = "probs", ne = [1, "n_expert", "src.ne1"] },
  { op = "get_rows", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["probs", "ffn_moe_topk"], out = "ffn_moe_weights" },
  # w_scale is hparams.expert_weights_scale, which llama4 never reads, so it is 0 and
  # build_moe_ffn skips the scale.
  { op = "reshape", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_norm"], out = "moe_in", ne = ["n_embd", 1, "src.ne1"] },
  # weight_before_ffn, set for LLM_ARCH_LLAMA4: each token's row is repeated once per
  # chosen expert and scaled by that expert's weight before the experts run, so the
  # experts' output is not weighted again.
  { op = "repeat", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["moe_in"], out = "repeated", ne = ["n_embd", "n_expert_used", "src.ne2", 1] },
  { op = "mul", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["repeated", "ffn_moe_weights"], out = "ffn_moe_weighted" },
  { op = "mul_mat_id", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["blk.{L}.ffn_up_exps.weight", "ffn_moe_weighted", "ffn_moe_topk"], out = "ffn_moe_up" },
  { op = "mul_mat_id", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["blk.{L}.ffn_gate_exps.weight", "ffn_moe_weighted", "ffn_moe_topk"], out = "ffn_moe_gate" },
  { op = "swiglu", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_moe_gate", "ffn_moe_up"], out = "ffn_moe_swiglu" },
  { op = "mul_mat_id", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["blk.{L}.ffn_down_exps.weight", "ffn_moe_swiglu", "ffn_moe_topk"], out = "ffn_moe_down" },
  # Sum over the chosen experts: a view of each, all views first, then an add chain.
  { op = "view", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_moe_down"], out = "ffn_moe_out", ne = ["n_embd", "src.ne2"], nb = ["src.nb2"], offset = 0 },
  { op = "view", for = "e in 1..n_expert_used", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_moe_down"], out = "cur_experts.{e}", ne = ["n_embd", "src.ne2"], nb = ["src.nb2"], offset = "e * src.nb1" },
  { op = "add", for = "e in 1..n_expert_used", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_moe_out", "cur_experts.{e}"], out = "ffn_moe_out" },
  { op = "cont", when = "has(blk.{L}.ffn_gate_inp.weight) && n_expert_used == 1", in = ["ffn_moe_out"], out = "ffn_moe_out" },

  # llama4.cpp: the shared expert, build_ffn(up_shexp, gate_shexp, down_shexp,
  # LLM_FFN_SILU, LLM_FFN_PAR) over the same normed input, added to the experts' sum.
  # llama.cpp names the sum ffn_moe_out_merged; here it is ffn_out, as on the dense
  # path, so one residual add reads either.
  { op = "mul_mat", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["blk.{L}.ffn_up_shexp.weight", "ffn_norm"], out = "ffn_up" },
  { op = "mul_mat", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["blk.{L}.ffn_gate_shexp.weight", "ffn_norm"], out = "ffn_gate" },
  { op = "swiglu", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_gate", "ffn_up"], out = "ffn_swiglu" },
  { op = "mul_mat", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["blk.{L}.ffn_down_shexp.weight", "ffn_swiglu"], out = "ffn_moe_shexp" },
  { op = "add", when = "has(blk.{L}.ffn_gate_inp.weight)", in = ["ffn_moe_out", "ffn_moe_shexp"], out = "ffn_out" },

  # The residual; the result is the next layer's input.
  { op = "add", in = ["ffn_out", "ffn_inp"], out = "inpL" },
]

epilogue = [
  # build_norm(inpL, output_norm, NULL, LLM_NORM_RMS, -1)
  { op = "rms_norm", in = ["inpL"], out = "norm", eps = "f_norm_rms_eps" },
  { op = "mul", in = ["norm", "output_norm.weight"], out = "result_norm" },
  # build_lora_mm(output): the LM head, which is token_embd.weight in a tied model.
  { op = "mul_mat", in = ["output.weight", "result_norm"], out = "result_output" },
]
