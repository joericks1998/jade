# Author: Joe Ricks
# File: .github/workflows/release.yml
# Description: Builds the dovata and gguf-inspect programs for Linux and macOS and
# publishes them, with their checksums, as a GitHub release.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Sent by the tag-release job in ci.yml when main's version is new.
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, such as v3.0.1'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc, the same as jadelang, so the two install side by side on the
          # same machines.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: dovata-linux-x86_64.tar.gz

          # Apple Silicon only, the same as jadelang: Metal is the target, and
          # GitHub is retiring its Intel runners.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: dovata-macos-arm64.tar.gz

    steps:
      # Every trigger builds the tagged commit. A manual run names its tag as an
      # input, and a dispatch carries it in its payload.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag || github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p dovata

      # A tag whose name does not match Cargo.toml's version would ship programs
      # that report the wrong version, so the build stops here.
      - name: Check the version
        run: |
          got="$(target/${{ matrix.target }}/release/dovata --version)"
          if [ "$got" != "dovata ${TAG#v}" ]; then
            echo "::error::the tag is $TAG, but the program says \"$got\""
            exit 1
          fi
          echo "$got"

      # The archive holds the two programs at its top level. install.sh unpacks it
      # into <prefix>/bin. refback is not in it: it is the test-only reference
      # backend and is never published.
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/dovata dist/
          cp target/${{ matrix.target }}/release/gguf-inspect dist/
          tar -czf ${{ matrix.archive }} -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Tag:          $TAG"
          case "$TAG" in
            v*) ;;
            *) echo "::error::the tag \"$TAG\" does not start with v"; exit 1 ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          pattern: dovata-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum \
            dovata-linux-x86_64.tar.gz \
            dovata-macos-arm64.tar.gz > checksums.txt
          cat checksums.txt

      # This updates the release when one already exists for the tag, so a manual
      # run can attach programs to a release made by hand.
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dovata-linux-x86_64.tar.gz
            dovata-macos-arm64.tar.gz
            checksums.txt
