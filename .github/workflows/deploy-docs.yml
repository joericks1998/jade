name: Deploy Docs

on:
  push:
    branches: [main]
    # dovata's install script is served from the site too, so a change to it deploys.
    paths: ['docs/**', 'dovata/install.sh']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      # Each crate keeps its installer: the compiler's is docs/static/install.sh, served
      # as https://jadelang.org/install.sh, and dovata's stays in dovata/, so it is
      # copied in here, to https://jadelang.org/dovata/install.sh.
      - name: Add dovata's install script
        run: |
          mkdir -p docs/build/dovata
          cp dovata/install.sh docs/build/dovata/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build
      - id: deploy
        uses: actions/deploy-pages@v4
