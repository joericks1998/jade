name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `submodules` is required, not tidiness: protocol/ holds the shared
      # InferRequest definition. Without it the tripwire test cannot read the
      # file and the parity gate cannot build its stub provider.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `jade build` compiles in-process, so LLVM 18 is a hard build dependency
      # of the toolchain. libpolly-18-dev is not optional: llvm-config lists
      # Polly in --libnames, so without it llvm-sys fails with "could not find
      # native static library `Polly`".
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev

      # Overrides the Apple Silicon Homebrew path in .cargo/config.toml. Cargo's
      # [env] does not set a variable that is already present, so this wins.
      - name: Build
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: cargo build --verbose

      - name: Test
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: cargo test --verbose

      # Deliberately not `-D warnings`: the tree carries ~120 style warnings and
      # failing on them would mean either a large mechanical diff or a step
      # nobody can keep green. Clippy's correctness lints are deny-by-default,
      # so this still fails the build on the class that matters — it caught an
      # `approx_constant` error that had been sitting unnoticed because nothing
      # ran clippy at all.
      - name: Clippy
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: cargo clippy --all-targets

      # Exercises the real `jade check` binary against every committed fixture,
      # covering the CLI wiring and on-disk cache that the in-process test in
      # cli/check.rs cannot reach. Fixtures named *_error.jde document rejected
      # programs and must fail; everything else must pass.
      - name: Check examples
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r file; do
            if [[ "$file" == *_error.jde ]]; then
              if ./target/debug/jade check "$file" >/dev/null 2>&1; then
                echo "::error file=$file::expected 'jade check' to reject this fixture, but it passed"
                status=1
              fi
            elif ! output=$(./target/debug/jade check "$file" 2>&1); then
              echo "::error file=$file::$output"
              status=1
            fi
          done < <(find examples -name '*.jde' | sort)
          exit $status

      # Runs every example on both the VM and the AOT backend and diffs the
      # output. The two paths have silently diverged three times; each was
      # caught by hand, because no automated check ever ran a program both
      # ways. See the script header for the skip list.
      #
      # This covers examples/llm too: the script builds scripts/fake-provider.jde
      # as a stand-in inference provider answering with a canned reply, so the
      # LLM paths are deterministic rather than skipped. Pointing the gate at
      # them turned up a VM muting bug and an AOT segfault immediately, so they
      # are worth keeping covered.
      - name: Backend parity
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: ./scripts/backend-parity.sh

  tag-release:
    name: Tag release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create version tag if new
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists — skipping."
            echo "NEW_TAG=false" >> $GITHUB_ENV
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "NEW_TAG=true" >> $GITHUB_ENV
            echo "TAG=$TAG" >> $GITHUB_ENV
            echo "Pushed $TAG"
          fi

      - name: Dispatch release workflow
        if: env.NEW_TAG == 'true'
        run: |
          echo "Dispatching release workflow for $TAG..."
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            --method POST \
            -f event_type=release \
            -f "client_payload[tag]=$TAG"
          echo "Dispatch sent successfully."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: Docs are deployed exclusively by deploy-docs.yml, which runs
  # `npm run build` and publishes the compiled site (docs/build). A second
  # deploy job used to live here and uploaded the raw, unbuilt `docs/` tree
  # straight to GitHub Pages — on code-only releases (no docs/** changes)
  # deploy-docs.yml is skipped, so this job would clobber Pages with source
  # files and 404 the site. It was removed; do not re-add a Pages deploy here.
