name: CI/CD

# The compiler's workflow. dovata, under dovata/, has its own in dovata-ci.yml, and
# the VS Code extension, under vscode/, has its own in vscode-ci.yml, so a change to
# the extension alone does not install LLVM and build the compiler. The compiler links
# dovata's library to read the dovata process's records, so a change to that library
# runs this workflow too; dovata's installer, docs, command line and its other two
# crates do not.
on:
  push:
    branches: [main]
    paths-ignore:
      - "dovata/install.sh"
      - "dovata/docs/**"
      - "dovata/**/*.md"
      - "dovata/src/cli/**"
      - "dovata/src/chat_template/**"
      - "dovata/src/refback/**"
      - ".github/workflows/dovata-*.yml"
      - "vscode/**"
      - ".github/workflows/vscode-*.yml"
  pull_request:
    branches: [main, "2.0.0"]
    paths-ignore:
      - "dovata/install.sh"
      - "dovata/docs/**"
      - "dovata/**/*.md"
      - "dovata/src/cli/**"
      - "dovata/src/chat_template/**"
      - "dovata/src/refback/**"
      - ".github/workflows/dovata-*.yml"
      - "vscode/**"
      - ".github/workflows/vscode-*.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `jade build` compiles in-process, so LLVM 18 is a hard build dependency
      # of the toolchain. libpolly-18-dev is not optional: llvm-config lists
      # Polly in --libnames, so without it llvm-sys fails with "could not find
      # native static library `Polly`". liblld-18-dev carries LLD's static
      # libraries, which the static backend links programs with in-process.
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev liblld-18-dev

      # glib is the FFI gate's fixture — see compiler/src/scripts/ffi-gate.sh for why a
      # big ordinary library is the point. pkg-config is how the gate finds it,
      # since the library sits in an architecture-named directory.
      - name: Install glib
        run: sudo apt-get install -y libglib2.0-dev pkg-config

      # Overrides the Apple Silicon Homebrew path in .cargo/config.toml. Cargo's
      # [env] does not set a variable that is already present, so this wins.
      - name: Build
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: cargo build --verbose

      - name: Test
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: cargo test --verbose

      # Deliberately not `-D warnings`: the tree carries ~120 style warnings and
      # failing on them would mean either a large mechanical diff or a step
      # nobody can keep green. Clippy's correctness lints are deny-by-default,
      # so this still fails the build on the class that matters — it caught an
      # `approx_constant` error that had been sitting unnoticed because nothing
      # ran clippy at all.
      - name: Clippy
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: cargo clippy --all-targets

      # The tree was not rustfmt-clean, so `cargo fmt` rewrote 151 files and
      # anyone who ran it lost their own diff in the noise. `rustfmt.toml` now
      # says what the code was already written to, and this keeps it true —
      # which is the only way the command stays safe to run.
      #
      # Needs no LLVM: rustfmt parses, it does not build. `-p jade`, not `--all`:
      # dovata is in the workspace and is not formatted with rustfmt, for the reason
      # dovata-ci.yml gives.
      - name: Rust formatting
        run: cargo fmt -p jade --check

      # Exercises the real `jade check` binary against every committed fixture,
      # covering the CLI wiring and on-disk cache that the in-process test in
      # cli/check.rs cannot reach. Fixtures named *_error.jde document rejected
      # programs and must fail; everything else must pass, apart from a feature
      # v2 does not compile yet, such as a prompt, which is reported as pending.
      - name: Check examples
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r file; do
            if [[ "$file" == *_error.jde ]]; then
              if ./target/debug/jade check "$file" >/dev/null 2>&1; then
                echo "::error file=$file::expected 'jade check' to reject this fixture, but it passed"
                status=1
              fi
            elif ! output=$(./target/debug/jade check "$file" 2>&1); then
              if [[ "$output" == *"jade cannot compile"* ]]; then
                echo "pending: $output"
              else
                echo "::error file=$file::$output"
                status=1
              fi
            fi
          done < <(find examples -name '*.jde' | sort)
          exit $status

      # `jade fmt` is the one command nothing else in CI exercises, and it
      # rotted unnoticed until it was reindenting the inside of multi-line
      # strings — changing what a program printed, in place, on a tree nobody
      # ran it over. Holding the fixture suite formatted keeps the formatter
      # honest against 70-odd real files on every push.
      - name: Check formatting
        run: ./target/debug/jade fmt --check examples

      # Builds every example and compares each binary's output to the
      # `<name>.expected` beside it. Until v1.4.8 this was a parity gate that ran
      # each example on the VM and on the compiled backend and diffed the two;
      # v2 has one engine, so the outputs recorded where both agreed are the
      # oracle instead. See the script header for the skip list.
      - name: Golden outputs
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: ./compiler/src/scripts/golden.sh

      # Binds a real C library and runs it, once and then 600,000 times.
      #
      # It exists because of bugs that reached users: binding glib rather than
      # the tidy libraries the survey used turned up a callback parameter
      # checked against a typedef's name instead of its category, and a
      # function-like macro shadowing the symbol we bound. Each refused the
      # whole dependency. The long run catches a leak or a crash that only
      # shows under sustained churn.
      - name: FFI gate
        env:
          LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
        run: ./compiler/src/scripts/ffi-gate.sh

  tag-release:
    name: Tag release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The compiler releases when its own version, compiler/Cargo.toml's, is new.
      # Its tags stay plain `v2.0.1`, the scheme every earlier release used; dovata's
      # are `dovata-v3.2.0`, pushed by dovata-ci.yml from dovata/Cargo.toml. The root
      # Cargo.toml is the workspace's and has no version.
      - name: Create version tag if new
        run: |
          VERSION=$(grep '^version' compiler/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists — skipping."
            echo "NEW_TAG=false" >> $GITHUB_ENV
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "NEW_TAG=true" >> $GITHUB_ENV
            echo "TAG=$TAG" >> $GITHUB_ENV
            echo "Pushed $TAG"
          fi

      - name: Dispatch release workflow
        if: env.NEW_TAG == 'true'
        run: |
          echo "Dispatching release workflow for $TAG..."
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            --method POST \
            -f event_type=release \
            -f "client_payload[tag]=$TAG"
          echo "Dispatch sent successfully."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: Docs are deployed exclusively by deploy-docs.yml, which runs
  # `npm run build` and publishes the compiled site (docs/build). A second
  # deploy job used to live here and uploaded the raw, unbuilt `docs/` tree
  # straight to GitHub Pages — on code-only releases (no docs/** changes)
  # deploy-docs.yml is skipped, so this job would clobber Pages with source
  # files and 404 the site. It was removed; do not re-add a Pages deploy here.
