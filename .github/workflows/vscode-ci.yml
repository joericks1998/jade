# Author: Joe Ricks
# File: .github/workflows/vscode-ci.yml
# Description: Packages the VS Code extension, under vscode/, for every pull request
# and push to main that touches it, and tags an extension release when
# vscode/package.json's version is new.

name: VS Code extension CI

# Changes to the extension and its two workflows, and to any .jde file, since the
# grammar test tokenizes every one. The compiler's ci.yml ignores vscode/, so an
# extension change builds no Rust.
on:
  push:
    branches: [main]
    paths:
      - "vscode/**"
      - ".github/workflows/vscode-*.yml"
      - "compiler/src/**/*.jde"
      - "examples/**"
  pull_request:
    branches: [main]
    paths:
      - "vscode/**"
      - ".github/workflows/vscode-*.yml"
      - "compiler/src/**/*.jde"
      - "examples/**"
  workflow_dispatch:

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      # VS Code skips a grammar or language configuration it cannot parse, with
      # no error a user would see, so a broken file fails here instead.
      - name: Check the JSON files parse
        run: |
          for f in package.json language-configuration.json syntaxes/jade.tmLanguage.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"
            echo "ok $f"
          done

      # Tokenizes a case for each construct in the compiler's lexer and parser,
      # and every .jde file in the repo, with vscode-textmate, the engine VS Code
      # uses. A rule that colors a construct wrongly, or marks valid code as an
      # error, fails here.
      - name: Test the grammar
        working-directory: vscode/test
        run: |
          npm ci
          npm test

      # The same packaging the release runs, so a manifest the Marketplace would
      # refuse fails before the merge.
      - name: Package
        run: vsce package --out jadelang-extension.vsix

  tag-release:
    name: Tag release
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The extension releases when its own version, vscode/package.json's, is new.
      # Its tags are `vscode-v1.1.3`, so they never meet the compiler's `v2.0.1`.
      - name: Create version tag if new
        run: |
          VERSION=$(node -p "require('./vscode/package.json').version")
          TAG="vscode-v$VERSION"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists, so there is nothing to release."
            echo "NEW_TAG=false" >> "$GITHUB_ENV"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "NEW_TAG=true" >> "$GITHUB_ENV"
            echo "TAG=$TAG" >> "$GITHUB_ENV"
            echo "Pushed $TAG"
          fi

      # A tag pushed with the workflow's own token starts no other workflow, so
      # the release workflow is started by a dispatch instead.
      - name: Dispatch release workflow
        if: env.NEW_TAG == 'true'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            --method POST \
            -f event_type=release-vscode \
            -f "client_payload[tag]=$TAG"
          echo "Dispatched the extension release workflow for $TAG."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
