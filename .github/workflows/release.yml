name: Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: jade-linux-x86_64.tar.gz
            binary: jade

          - os: macos-latest
            target: aarch64-apple-darwin
            archive: jade-macos-arm64.tar.gz
            binary: jade

          - os: macos-latest
            target: x86_64-apple-darwin
            archive: jade-macos-x86_64.tar.gz
            binary: jade

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: jade-windows-x86_64.zip
            binary: jade.exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} jade
          tar -czf ${{ matrix.archive }} jade

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target\${{ matrix.target }}\release\${{ matrix.binary }} jade.exe
          Compress-Archive jade.exe ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  universal-macos:
    name: macOS universal binary
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jade-macos-arm64.tar.gz

      - uses: actions/download-artifact@v4
        with:
          name: jade-macos-x86_64.tar.gz

      - name: Create universal binary
        run: |
          tar -xzf jade-macos-arm64.tar.gz -O > jade-arm64
          tar -xzf jade-macos-x86_64.tar.gz -O > jade-x86_64
          lipo -create -output jade jade-arm64 jade-x86_64
          tar -czf jade-macos-universal.tar.gz jade

      - uses: actions/upload-artifact@v4
        with:
          name: jade-macos-universal.tar.gz
          path: jade-macos-universal.tar.gz

  release:
    name: Publish release
    needs: [build, universal-macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Debug trigger info
        run: |
          echo "Triggered by:       ${{ github.event_name }}"
          echo "Ref:                ${{ github.ref }}"
          echo "Ref name:           ${{ github.ref_name }}"
          echo "Dispatch tag:       ${{ github.event.client_payload.tag }}"
          echo "Manual input tag:   ${{ github.event.inputs.tag }}"
          echo "Resolved TAG:       $TAG"
          if [ -z "$TAG" ]; then
            echo "ERROR: TAG is empty — cannot create release"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: jade-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum \
            jade-linux-x86_64.tar.gz \
            jade-macos-arm64.tar.gz \
            jade-macos-x86_64.tar.gz \
            jade-macos-universal.tar.gz \
            jade-windows-x86_64.zip > checksums.txt
          cat checksums.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            jade-linux-x86_64.tar.gz
            jade-macos-arm64.tar.gz
            jade-macos-x86_64.tar.gz
            jade-macos-universal.tar.gz
            jade-windows-x86_64.zip
            checksums.txt
