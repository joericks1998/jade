name: Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc, not musl: `jade build` links LLVM 18 in-process, and LLVM's
          # prebuilt distributions are glibc-based — a static musl build would
          # mean sourcing or building a musl LLVM. Revisit if a fully static
          # Linux binary becomes worth that.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: jade-linux-x86_64.tar.gz
            binary: jade

          - os: macos-latest
            target: aarch64-apple-darwin
            archive: jade-macos-arm64.tar.gz
            binary: jade

          - os: macos-latest
            target: x86_64-apple-darwin
            archive: jade-macos-x86_64.tar.gz
            binary: jade

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # LLVM 18 is a hard build dependency: the toolchain compiles Jade to
      # native code in-process rather than shipping it to a daemon. It is
      # linked into the released binary, so users install nothing.
      - name: Install LLVM 18 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The tarball ships the toolchain, not just the binary: `jade build` links
      # libJadeRuntime.a (C) and libjade_runtime.a (Rust) into every executable
      # it emits. Shipping only `jade` left installed users with a working
      # `jade run` and a `jade build` that failed with "cannot find
      # -lJadeRuntime", because the paths baked in at compile time point into
      # this runner's target/ directory. Layout is `jade` + `lib/*.a`, which
      # install.sh unpacks to <prefix>/bin and <prefix>/lib/jade.
      - name: Package
        run: |
          mkdir -p dist/lib
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/jade
          cp target/${{ matrix.target }}/release/libJadeRuntime.a dist/lib/
          cp target/${{ matrix.target }}/release/libjade_runtime.a dist/lib/
          tar -czf ${{ matrix.archive }} -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  universal-macos:
    name: macOS universal binary
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jade-macos-arm64.tar.gz

      - uses: actions/download-artifact@v4
        with:
          name: jade-macos-x86_64.tar.gz

      # `tar -O` concatenated the whole archive to stdout, which worked only
      # while the tarball held exactly one file. It now carries lib/*.a too, so
      # unpack into directories and lipo each artifact — the static archives
      # have to be universal as well, or `jade build` on one arch would link a
      # runtime built for the other.
      - name: Create universal binary
        run: |
          mkdir -p arm64 x86_64 dist/lib
          tar -xzf jade-macos-arm64.tar.gz -C arm64
          tar -xzf jade-macos-x86_64.tar.gz -C x86_64
          lipo -create -output dist/jade arm64/jade x86_64/jade
          for a in libJadeRuntime.a libjade_runtime.a; do
            lipo -create -output "dist/lib/$a" "arm64/lib/$a" "x86_64/lib/$a"
          done
          tar -czf jade-macos-universal.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: jade-macos-universal.tar.gz
          path: jade-macos-universal.tar.gz

  release:
    name: Publish release
    needs: [build, universal-macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Debug trigger info
        run: |
          echo "Triggered by:       ${{ github.event_name }}"
          echo "Ref:                ${{ github.ref }}"
          echo "Ref name:           ${{ github.ref_name }}"
          echo "Dispatch tag:       ${{ github.event.client_payload.tag }}"
          echo "Manual input tag:   ${{ github.event.inputs.tag }}"
          echo "Resolved TAG:       $TAG"
          if [ -z "$TAG" ]; then
            echo "ERROR: TAG is empty — cannot create release"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: jade-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum \
            jade-linux-x86_64.tar.gz \
            jade-macos-arm64.tar.gz \
            jade-macos-x86_64.tar.gz \
            jade-macos-universal.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            jade-linux-x86_64.tar.gz
            jade-macos-arm64.tar.gz
            jade-macos-x86_64.tar.gz
            jade-macos-universal.tar.gz
            checksums.txt
