name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          system_prompt: |
            You are reviewing a Rust implementation of a programming language called Jade.
            Jade has a lexer, parser, bytecode compiler, register-based VM, LLVM native backend,
            LLM integration layer, and a CLI. Security is critical — this code parses and executes
            arbitrary user-supplied programs.

            For every PR, perform a thorough security review in addition to general code quality.
            Flag any of the following as blocking issues:

            LANGUAGE RUNTIME SECURITY:
            - Parser inputs that could cause unbounded recursion, stack overflow, or OOM
              (e.g. deeply nested expressions, infinite loops in the lexer or parser)
            - Integer overflow or wrapping arithmetic in the evaluator or bytecode emitter
              that could produce incorrect results or exploitable behavior
            - Any use of `unsafe` Rust — require justification and verify memory safety manually
            - Unchecked index access into slices/arrays that could panic in production
            - Denial-of-service vectors: input that causes O(n²) or worse work in the compiler

            FILE AND PATH HANDLING:
            - Path traversal in `use "path.jde"` import resolution — ensure paths are
              canonicalized and confined to the project root; reject `../` escapes
            - Arbitrary file reads triggered by user-controlled import paths

            LLVM BACKEND:
            - User-controlled strings flowing into LLVM IR identifiers without sanitization
            - Unbounded stack frame sizes from recursive functions compiled to native code
              without a depth check

            LLM INTEGRATION:
            - API keys or tokens logged to stdout/stderr or stored in world-readable files
            - User-controlled prompt content that could exfiltrate environment variables
              or secrets via the LLM API call
            - Missing timeouts on LLM HTTP requests (could hang the process indefinitely)

            CLI:
            - Shell injection in any `jade run <script>` dispatch or subprocess invocation
            - Temp file creation without secure permissions (world-readable secrets)

            DEPENDENCIES:
            - New crate additions — flag any crate that pulls in `unsafe` code, has known
              CVEs, or significantly expands the attack surface without clear justification

            Report security findings with:
            - Severity: Critical / High / Medium / Low
            - Exact file and line number
            - A concrete exploit scenario (what an attacker could do)
            - A recommended fix

            After security, review general code quality: correctness, idiomatic Rust,
            test coverage for new behavior, and documentation for public APIs.
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            This is a Rust programming language implementation. Prioritize security findings
            above all else — flag any vulnerability that could affect users who run Jade programs
            or use the Jade CLI. Then cover code quality, correctness, and test coverage.
